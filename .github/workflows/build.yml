name: Build Windows EXE
on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests openpyxl
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build with PyInstaller（目录模式，禁用onefile）
        run: |
          pyinstaller `
            --windowed `
            --noconsole `
            --name "worldlibrary_tool" `
            --clean `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: worldlibrary_tool-windows
          path: dist/worldlibrary_tool/

      - name: Create Release (tag触发)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/worldlibrary_tool/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
